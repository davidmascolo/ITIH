[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itih-predictor"
version = "0.1.0"
description = "Inference of intratumoral immune heterogeneity from normalized MFP signatures"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Davide Mascolo"}
]
keywords = [
  "bioinformatics",
  "catboost",
  "immunotherapy",
  "intratumoral heterogeneity",
  "NSCLC"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "catboost>=1.2,<2",
  "numpy>=1.23",
  "pandas>=1.5"
]

[project.optional-dependencies]
test = [
  "build>=1.0",
  "pytest>=7"
]

[project.scripts]
itih = "itih.cli:main"

[project.urls]
Homepage = "https://github.com/davidmascolo/ITIH"
Repository = "https://github.com/davidmascolo/ITIH"
Publication = "https://doi.org/10.1158/1078-0432.CCR-26-1466"
Issues = "https://github.com/davidmascolo/ITIH/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
itih = ["assets/*.json", "assets/*.md", "assets/*.cbm"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
